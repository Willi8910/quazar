# Builds Quazar for macOS and Windows and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# (or run it by hand from the Actions tab). The version in the tag should match package.json; a tag with a
# suffix (v0.2.0-windows.1) is published as a pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build for both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # An NSIS installer (.exe), unsigned.
          - platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        shell: bash
        run: |
          npx tsc --noEmit
          npx vitest run
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files (see tauri.release.conf.json); the app checks them with the public key in
          # tauri.conf.json. The key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quazar ${{ github.ref_name }}
          releaseBody: |
            **macOS:** download **Quazar_*_universal.dmg** below, open it and drag Quazar to Applications.
            Quazar isn't signed with an Apple Developer ID yet, so macOS may refuse to open it the first time.
            Run `xattr -dr com.apple.quarantine /Applications/Quazar.app` once in Terminal, then open it.

            **Windows (preview):** download **Quazar_*_x64-setup.exe** below and run it. It isn't signed yet:
            if SmartScreen warns, choose *More info → Run anyway*.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          # latest.json: what installed copies check for updates.
          includeUpdaterJson: true
