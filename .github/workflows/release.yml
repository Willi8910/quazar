# Builds Quazar and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# (or run it by hand from the Actions tab). The version in the tag should match package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build for both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: |
          npx tsc --noEmit
          npx vitest run
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quazar ${{ github.ref_name }}
          releaseBody: |
            Download **Quazar_*_universal.dmg** below, open it and drag Quazar to Applications.

            First launch: Quazar isn't signed with an Apple Developer ID yet, so macOS may refuse to open it.
            Run `xattr -dr com.apple.quarantine /Applications/Quazar.app` once in Terminal, then open it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
